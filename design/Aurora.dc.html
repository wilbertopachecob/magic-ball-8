<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #9fe8d8; } a:hover { color: #ffffff; }
  </style>
</helmet>
<div style="width: 760px; height: 1000px; box-sizing: border-box; font-family: 'Space Grotesk', system-ui, sans-serif; color: #eef0f6; background-color: #08070d; background-image: radial-gradient(60% 42% at 22% 14%, rgba(96, 232, 205, 0.20), transparent 70%), radial-gradient(58% 40% at 84% 26%, rgba(150, 122, 255, 0.22), transparent 72%), radial-gradient(70% 50% at 50% 108%, rgba(64, 118, 255, 0.16), transparent 70%); display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 30px 40px;">
    <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #9aa0b8;">Magic 8 Ball</span>
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05);">
      <span style="padding: 9px 18px; border-radius: 999px; background: rgba(255,255,255,0.92); color: #08070d; font-size: 14px; font-weight: 700;">EN</span>
      <span style="padding: 9px 18px; border-radius: 999px; color: #c3c7d8; font-size: 14px; font-weight: 500;">ES</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px; padding: 20px 60px 60px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(159, 232, 216, 0.28); background: rgba(159, 232, 216, 0.08);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9fe8d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
        <span style="font-size: 13px; letter-spacing: 0.06em; color: #9fe8d8;">Breathe in, then ask</span>
      </div>
      <h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 300; font-size: 44px; line-height: 1.1; text-align: center; letter-spacing: -0.01em;">What do you want to know?</h1>
    </div>

    <div style="width: 360px; height: 360px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 36% 30%, rgba(255,255,255,0.30), rgba(122,140,255,0.16) 34%, rgba(10,12,24,0.9) 68%), radial-gradient(circle at 62% 74%, rgba(96,232,205,0.30), transparent 58%); border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 0 90px rgba(122, 140, 255, 0.30), inset 0 0 70px rgba(0,0,0,0.6);">
      <div style="width: 262px; height: 262px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; padding: 34px; box-sizing: border-box;">
        <p style="margin: 0; font-family: Newsreader, Georgia, serif; font-style: italic; font-weight: 300; font-size: 34px; line-height: 1.25; text-align: center; text-wrap: balance; color: #ffffff;">Outlook good.</p>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <button type="button" style="display: inline-flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 34px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); color: #eef0f6; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 0.02em; cursor: pointer; box-shadow: 0 0 0 4px rgba(159, 232, 216, 0.18);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#eef0f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg>
        Ask once more
      </button>
      <p style="margin: 0; font-size: 14px; color: #8d93ab; text-align: center; max-width: 34ch; line-height: 1.5;">The ball takes a moment. Space bar works, and so does a shake.</p>
    </div>

  </div>

  <div style="padding: 0 40px 34px; display: flex; justify-content: center;">
    <div style="display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.04);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa0b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"></path><path d="M12 4v16"></path></svg>
      <span style="font-size: 13px; color: #9aa0b8;">Reduced motion: the glow settles instead of pulsing.</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":760,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
