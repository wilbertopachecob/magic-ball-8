<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c0392b; } a:hover { color: #111111; }
  </style>
</helmet>
<div style="width: 760px; height: 1000px; box-sizing: border-box; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #14140f; background: #e6e3d9; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 32px; border-bottom: 2px solid #14140f;">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em;">8BALL.TICKER</span>
    <div style="display: flex; gap: 18px; font-size: 13px; font-weight: 600;">
      <span style="border-bottom: 2px solid #c0392b; padding-bottom: 2px;">EN</span>
      <span style="color: #6d6a5e;">ES</span>
    </div>
  </div>

  <div style="padding: 40px 32px 28px; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <label style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; color: #6d6a5e;">TYPE YOUR QUESTION</label>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 20px; background: #f6f4ee; border: 2px solid #14140f; box-shadow: 5px 5px 0 #14140f;">
        <span style="color: #c0392b; font-size: 20px; font-weight: 700;">&gt;</span>
        <span style="font-size: 20px; font-weight: 500;">Should I ship it on Friday?</span>
        <span style="width: 11px; height: 24px; background: #14140f;"></span>
      </div>
    </div>

    <div style="display: flex; gap: 14px; align-items: stretch;">
      <button type="button" style="flex-grow: 1; display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 64px; border: 2px solid #14140f; background: #c0392b; color: #f6f4ee; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.12em; cursor: pointer; box-shadow: 5px 5px 0 #14140f;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f6f4ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
        ASK
      </button>
      <div style="display: inline-flex; align-items: center; padding: 0 20px; border: 2px dashed #8d8a7c; font-size: 13px; color: #6d6a5e;">or shake</div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 0 32px 34px; display: flex; flex-direction: column; gap: 0; min-height: 0;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; color: #6d6a5e;">TODAY'S TAPE</span>
      <span style="font-size: 12px; font-weight: 600; color: #6d6a5e;">3 ANSWERS</span>
    </div>

    <div style="background: #f6f4ee; border: 2px solid #14140f; display: flex; flex-direction: column;">

      <div style="padding: 24px 26px; display: flex; flex-direction: column; gap: 10px; border-bottom: 2px dashed #c9c5b6;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px;">
          <span style="font-size: 15px; color: #4a4740;">Should I ship it on Friday?</span>
          <span style="font-size: 12px; color: #8d8a7c; white-space: nowrap;">14:20</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="padding: 3px 9px; background: #c0392b; color: #f6f4ee; font-size: 11px; font-weight: 700; letter-spacing: 0.1em;">NO</span>
          <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">Very doubtful.</span>
        </div>
      </div>

      <div style="padding: 22px 26px; display: flex; flex-direction: column; gap: 8px; border-bottom: 2px dashed #c9c5b6; opacity: 0.75;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px;">
          <span style="font-size: 14px; color: #4a4740;">Do they like the new logo?</span>
          <span style="font-size: 12px; color: #8d8a7c; white-space: nowrap;">14:06</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="padding: 3px 9px; background: #14140f; color: #f6f4ee; font-size: 11px; font-weight: 700; letter-spacing: 0.1em;">YES</span>
          <span style="font-size: 20px; font-weight: 600;">Signs point to yes.</span>
        </div>
      </div>

      <div style="padding: 22px 26px; display: flex; flex-direction: column; gap: 8px; opacity: 0.55;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px;">
          <span style="font-size: 14px; color: #4a4740;">Tacos for lunch?</span>
          <span style="font-size: 12px; color: #8d8a7c; white-space: nowrap;">13:41</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="padding: 3px 9px; background: #8d8a7c; color: #f6f4ee; font-size: 11px; font-weight: 700; letter-spacing: 0.1em;">MAYBE</span>
          <span style="font-size: 20px; font-weight: 600;">Ask again later.</span>
        </div>
      </div>

    </div>

    <div style="height: 14px; background: repeating-linear-gradient(90deg, #f6f4ee 0 10px, #e6e3d9 10px 20px); border-left: 2px solid #14140f; border-right: 2px solid #14140f;"></div>

    <p style="margin: 18px 0 0; font-size: 13px; line-height: 1.6; color: #6d6a5e;">The tape lives in your browser only. Clear it any time.</p>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":760,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
