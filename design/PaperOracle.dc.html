<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #16213a; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 760px; height: 1000px; box-sizing: border-box; font-family: Karla, system-ui, sans-serif; color: #1b1a17; background-color: #f7f1e4; background-image: radial-gradient(rgba(27, 26, 23, 0.13) 0.5px, transparent 0.5px); background-size: 6px 6px; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 24px 40px; border-bottom: 1.5px solid #1b1a17;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 28px; height: 28px; border-radius: 50%; background: #16213a; display: flex; align-items: center; justify-content: center; color: #f7f1e4; font-family: 'Instrument Serif', Georgia, serif; font-size: 16px; line-height: 1;">8</div>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;">Magic 8 Ball</span>
    </div>
    <div style="display: flex; gap: 3px; border: 1.5px solid #1b1a17; padding: 3px;">
      <span style="padding: 9px 18px; font-size: 14px; font-weight: 700; background: #1b1a17; color: #f7f1e4;">EN</span>
      <span style="padding: 9px 18px; font-size: 14px; font-weight: 600; color: #4a463d;">ES</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; padding: 44px 56px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 58px; line-height: 1; letter-spacing: -0.01em; text-align: center;">Ask, and it answers</h1>
      <p style="margin: 0; font-size: 17px; color: #5b5648; text-align: center; max-width: 34ch; line-height: 1.5;">Hold your question in mind, then turn the ball.</p>
    </div>

    <div style="width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle at 34% 27%, #33456d, #101827 60%, #060a12); box-shadow: 0 24px 0 -13px rgba(27, 26, 23, 0.16); display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="position: absolute; inset: 26px; border-radius: 50%; border: 1px solid rgba(247, 241, 228, 0.10);"></div>
      <div style="width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle at 42% 36%, #1a2740, #070c17); display: flex; align-items: center; justify-content: center;">
        <div style="width: 156px; height: 136px; background: #f7f1e4; clip-path: polygon(50% 0%, 100% 100%, 0% 100%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; box-sizing: border-box;">
          <span style="font-size: 17px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #a63b2a;">Yes</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 460px;">
      <div style="display: flex; align-items: center; gap: 14px; width: 100%;">
        <div style="flex-grow: 1; height: 1px; background: #cdc6b6;"></div>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #837d6e;">The ball says</span>
        <div style="flex-grow: 1; height: 1px; background: #cdc6b6;"></div>
      </div>
      <p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 46px; line-height: 1.12; text-align: center; text-wrap: balance;">Signs point to yes.</p>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <button type="button" style="display: inline-flex; align-items: center; gap: 12px; min-height: 62px; padding: 0 38px; border: 1.5px solid #1b1a17; background: #1b1a17; color: #f7f1e4; font-family: Karla, system-ui, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.02em; cursor: pointer; box-shadow: 6px 6px 0 rgba(27, 26, 23, 0.22);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f7f1e4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg>
        Ask again
      </button>
      <p style="margin: 0; font-size: 15px; color: #5b5648; text-align: center;">Press <span style="border: 1px solid #cdc6b6; background: #fbf7ee; padding: 2px 8px; font-size: 13px; font-weight: 600;">Space</span> to ask again.</p>
    </div>

  </div>

  <div style="border-top: 1.5px solid #1b1a17; padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #837d6e;">
    <span>Twenty answers, one ball</span>
    <span>On a phone, a shake works too</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":760,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
